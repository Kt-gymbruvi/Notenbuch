<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notenbuch</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(schriften/atkinson-hyperlegible-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(schriften/atkinson-hyperlegible-700-normal.woff2) format("woff2")}
</style>
<script src="bibliotheken/supabase.js"></script>
<style>:root{
  --navy:#14284B; --navy-2:#1F3A68; --yellow:#F2C230; --yellow-ink:#3A2C00;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EAEEF5; --ink:#172033; --muted:#5B6578; --line:#D7DDE8;
  --ok:#2F7D5B; --warn:#A8690F; --bad:#B23A3A; --e:#3D6FB6;
  --head-bg:var(--navy); --head-ink:#FFFFFF;
  --r:10px; --r-lg:16px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1527; --surface:#15213A; --surface-2:#1D2B48; --ink:#E7ECF5; --muted:#9BA7BE; --line:#283A5C;
    --ok:#5DBB8F; --warn:#E3A848; --bad:#E57373; --e:#7FA7E6; --head-bg:#0A1222; --navy-2:#2A4A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1527; --surface:#15213A; --surface-2:#1D2B48; --ink:#E7ECF5; --muted:#9BA7BE; --line:#283A5C;
  --ok:#5DBB8F; --warn:#E3A848; --bad:#E57373; --e:#7FA7E6; --head-bg:#0A1222; --navy-2:#2A4A80;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button,.desk,.tile,.key,.slot,.chip,.nowcard{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head-bg);color:var(--head-ink);
  display:flex;align-items:center;gap:12px;padding:10px 16px}
.top .brand{font-weight:700;letter-spacing:.01em;font-size:15px;opacity:.8}
.clsbtn{display:flex;flex-direction:column;align-items:flex-start;background:transparent;border:0;color:inherit;padding:2px 0;text-align:left;min-width:0}
.clsbtn b{font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.clsbtn b::after{content:" ▾";color:var(--yellow);font-size:15px}
.clsbtn small{opacity:.75;font-size:13px}
.sync{margin-left:auto;font-size:12.5px;display:flex;align-items:center;gap:6px;opacity:.9;white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:#9AA;display:inline-block}
.sync.ok i{background:#5DBB8F}.sync.busy i{background:var(--yellow)}.sync.off i{background:#E57373}
.heimknopf{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;color:inherit;flex:none;opacity:.85}
.heimknopf:hover{opacity:1;background:rgba(255,255,255,.12)}
.heim{color:var(--muted);font-size:14px;text-decoration:none;align-self:flex-start}
.heim:hover{text-decoration:underline}
.lockbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:8px;padding:5px 10px;font-size:14px}

main{padding:16px 16px 110px;max-width:1100px;margin:0 auto}

/* Navigation unten */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;max-width:150px;background:transparent;border:0;padding:8px 4px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.nav button[aria-current="page"] svg{color:var(--navy-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav button[aria-current="page"] svg{color:var(--yellow)}}

/* Grundbausteine */
h1{font-size:26px;margin:4px 0 14px;line-height:1.2}
h2{font-size:19px;margin:22px 0 10px}
h3{font-size:16px;margin:16px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}}
.btn.danger{color:var(--bad);border-color:currentColor;background:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.stack>*+*{margin-top:12px}
label.f{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;min-height:44px}
textarea.in{min-height:140px;resize:vertical;font-family:inherit}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:700;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;border:1px solid currentColor;line-height:1.5}
.badge.e{color:var(--e)}.badge.u{color:var(--bad)}.badge.v{color:var(--warn)}.badge.x{color:var(--muted)}.badge.nta{color:var(--ok)}
.empty{text-align:center;padding:40px 16px;border:2px dashed var(--line);border-radius:var(--r-lg)}
.empty p{max-width:46ch;margin:0 auto 14px}
.hint{border-left:4px solid var(--yellow);background:var(--surface);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;font-size:15px}
.warnbox{border-left:4px solid var(--bad);background:var(--surface);padding:10px 14px;border-radius:0 var(--r) var(--r) 0}

/* Schülerkacheln */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;text-align:left;min-height:86px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:18px;line-height:1.2}
.tile .sub{font-size:13.5px;color:var(--muted)}
.tile .marks{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.tile.absent{opacity:.55}

/* Tabellen */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:15.5px}
.t th,.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.t th{font-size:13px;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--surface)}
.t tr:last-child td{border-bottom:0}
.t td.c,.t th.c{text-align:center}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t input.cell{width:64px;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;background:var(--bg)}
.gl{display:inline-block;min-width:2.2em;text-align:center;font-weight:700;border-radius:7px;padding:1px 6px;background:var(--surface-2)}
.gl.over{background:var(--yellow);color:var(--yellow-ink)}

/* Notenpad – das Herzstück */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad.p16{grid-template-columns:repeat(4,1fr)}
.key{border:0;border-radius:14px;background:var(--navy);color:#fff;font-size:34px;font-weight:700;min-height:74px;
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.key:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.pad.p16 .key{font-size:26px;min-height:60px}
.key small{font-size:14px;opacity:.7;margin-left:4px}
.tend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tend button{border:2px solid var(--line);background:var(--surface);border-radius:12px;font-size:22px;font-weight:700;min-height:48px}
.tend button[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}

/* Vergessen-Markierungen, Notiz-Schlagworte, Suche, Klassenspiegel */
.badge.mk{color:var(--bad)}.badge.nt{color:var(--e)}
.desk.marked{box-shadow:0 0 0 3px var(--bad) inset}
.mkb{min-height:34px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit;font-size:13px;font-weight:600;cursor:pointer}
.mkb[aria-pressed="true"]{background:var(--bad);color:#fff;border-color:var(--bad)}
.mkb.pt[aria-pressed="true"]{background:#d97706;border-color:#d97706;color:#fff}
.mkb.pt.u[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.focusbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--yellow);padding:10px 14px;margin-bottom:12px}
.gfocus input.gcell,.gfocus select.zg{pointer-events:none}
.badge.pt{color:#d97706}
.mkrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mkhi{color:var(--bad);font-weight:700}
.sd{display:grid;gap:16px}
@media (min-width:760px){.sd{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}}
.sd details{margin-top:10px}
.tlist{display:flex;flex-direction:column}
.tld{font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.03em}
.tl{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:7px 2px;color:inherit;font:inherit}
button.tl:active{background:var(--surface-2)}
.tlk{flex:0 0 86px;font-size:12.5px;color:var(--muted);padding-top:2px}
.tlt{flex:1;min-width:0}
.tlt.bad,.statgrid .bad,.attrow .bad{color:var(--bad);font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.statgrid>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.statgrid b{font-size:1.2em}
/* Abhaklisten */
.lbox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lchk{flex:0 0 auto;width:40px;height:40px;border-radius:8px;border:2px solid var(--line);background:transparent;font-size:22px;font-weight:800;color:#fff;cursor:pointer;line-height:1}
.lchk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.lname{flex:1;min-width:0}
.lrow .lnote{flex:0 1 220px;min-width:90px;width:auto}
/* Listen im Erfassen */
.tile.ldone,.desk.ldone{background:color-mix(in srgb,var(--ok) 28%,var(--surface))}
.badge.lok{color:var(--ok)}
.desk .lbadge{position:absolute;bottom:2px;left:4px;font-size:11px;font-weight:700;line-height:1;z-index:2}
.lbadge.late{color:var(--bad)}
.lbanner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;margin-bottom:12px;border:2px solid var(--ok)}
.mkb.lst[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
/* Letzte Noten im Sitzplan-Popup und Schnellfenster */
.pprecent{margin-top:8px;border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:2px}
.pprow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:6px;border-radius:8px;border:0;background:transparent;color:inherit;font-size:13px;cursor:pointer;min-height:38px}
.pprow:hover,.pprow:focus-visible{background:color-mix(in srgb,var(--yellow) 20%,transparent)}
.pprow span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.pprow b{font-size:15px}
/* Lehrstoff */
.tparea{width:100%;min-height:96px;resize:vertical;font:inherit;line-height:1.4}
.tplab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tpcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;text-align:left;width:100%;background:transparent;color:inherit;cursor:pointer;display:block}
.tpcard p{margin:2px 0 0;white-space:pre-wrap}
.planhint{border-left:4px solid var(--yellow);padding:8px 12px;margin-bottom:12px}
/* AV/SV */
.avlist{display:flex;flex-direction:column;gap:6px}
.avg{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.avgh{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:12px 14px;border:0;background:transparent;color:inherit;font-weight:700;text-align:left;cursor:pointer;min-height:46px;font-size:15px}
.avgh .cnt{font-weight:500;font-size:12px;color:var(--muted)}
.avg.open .avgh{background:var(--surface-2)}
.avlv{display:flex;gap:8px;padding:6px 10px;border-top:1px solid var(--line);align-items:flex-start}
.avl{flex:0 0 22px;font-size:17px;padding-top:8px;text-align:center}
.avss{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.avs{text-align:left;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;padding:9px 10px;font-size:14px;line-height:1.35;cursor:pointer;min-height:44px}
.avs:hover,.avs:focus-visible{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 14%,transparent)}
.avgrid{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:3px 14px;font-size:14px;margin:4px 0 10px;align-items:baseline}
.avt th,.avt td{text-align:center}
.avt td.nm,.avt th.nm{text-align:left}
.avt .sug{font-weight:800;background:color-mix(in srgb,var(--yellow) 18%,transparent)}
.avent{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.avent>span{flex:1;min-width:0}
/* Sitzplan */
.seats{display:grid;gap:8px}
.seat{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:66px;padding:6px;font-size:14px;line-height:1.2;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.seat.emptyseat{border-style:dashed;color:var(--muted);background:transparent}
.seat .st{font-size:12px;font-weight:700}
.desk-front{text-align:center;font-size:13px;color:var(--muted);border-top:3px solid var(--line);padding-top:4px;margin-top:10px}

/* Anwesenheit */
.att{display:flex;gap:6px}
.att button{border:2px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;min-height:40px;font-weight:700;font-size:15px}
.att button[aria-pressed="true"].a{background:var(--ok);border-color:var(--ok);color:#fff}
.att button[aria-pressed="true"].e{background:var(--e);border-color:var(--e);color:#fff}
.att button[aria-pressed="true"].u{background:var(--bad);border-color:var(--bad);color:#fff}
.att button[aria-pressed="true"].v{background:var(--warn);border-color:var(--warn);color:#fff}

/* Notenspiegel */
.dist{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.dist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:13px}
.dist span.bar{width:100%;background:var(--navy-2);border-radius:6px 6px 0 0;min-height:2px}
.dist span.bar.fail{background:var(--bad)}

/* Modal / Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:86vh}}
.sheet .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet .sh h2{margin:0;font-size:22px}
.x{border:0;background:var(--surface-2);border-radius:50%;width:40px;height:40px;font-size:20px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);
  border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-weight:700;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{background:transparent;border:0;color:var(--yellow);font-weight:700;padding:4px}

/* Sperrbildschirm */
.lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--head-bg)}
.lock .card{max-width:420px;width:100%}
.lock .mark{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.lock .mark span{width:44px;height:44px;border-radius:12px;background:var(--yellow);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.list>*{padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.list>*:last-child{border-bottom:0}
.list button:hover{background:var(--surface-2)}
.chart{width:100%;height:auto;display:block}
.progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--yellow);width:0;transition:width .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Stundenplan */
.plan{display:grid;grid-template-columns:64px repeat(5,minmax(96px,1fr));gap:6px;padding:10px;min-width:560px}
.pc{border-radius:10px;min-height:64px}
.ph{min-height:auto;text-align:center;font-weight:700;color:var(--muted);padding:4px 0}
.ph.today{color:var(--ink);border-bottom:3px solid var(--yellow);border-radius:0}
.pt{display:flex;flex-direction:column;justify-content:center;font-size:12.5px;color:var(--muted);line-height:1.25}
.pt b{color:var(--ink);font-size:14px}
.pt .tm{width:100%;font-size:16px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px;margin-top:2px}
.slot{border:1px dashed var(--line);background:transparent;padding:8px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px}
.slot.todaycol{background:color-mix(in srgb,var(--yellow) 6%,transparent)}
.slot.filled{border:1px solid var(--line);border-left:6px solid var(--muted);background:var(--surface)}
.slot.filled b{font-size:16px;line-height:1.2}
.slot.filled span{font-size:12px;color:var(--muted)}
.slot.s-bio{border-left-color:var(--ok)}.slot.s-sport{border-left-color:var(--e)}
.slot.now{outline:3px solid var(--yellow);outline-offset:1px}
.slot{position:relative}

async function doUnlock(silent) {

    let state;

const loaded = {};
function loadScript(src) {

const LIB = {

// PDF -> Textzeilen (Zellen mit Tab getrennt), läuft ohne Netzwerkzugriff auf dem Gerät
async function pdfToText(file) {
  await loadScript(LIB.pdf); await loadScript(LIB.pdfWorker);
  const lib = window.pdfjsLib;
  const data = new Uint8Array(await file.arrayBuffer());
  const doc = await lib.getDocument({ data, isEvalSupported: false, useSystemFonts: true }).promise;
  const out = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const page = await doc.getPage(n);
    const tc = await page.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5], w: i.width }));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    for (const it of items) {
      const l = lines.find(L => Math.abs(L.y - it.y) < 3);
      if (l) l.items.push(it); else lines.push({ y: it.y, items: [it] });
    }
    lines.sort((a, b) => b.y - a.y);
    for (const l of lines) {
      l.items.sort((a, b) => a.x - b.x);
      let s = '', prevEnd = null;
      for (const it of l.items) { if (prevEnd != null) s += (it.x - prevEnd > 6 ? '\t' : ''); s += it.s; prevEnd = it.x + it.w; }
      out.push(s.trim());
    }
  }
  return out.join('\n');
}
// Foto -> Text per Tesseract (läuft im Browser; Modell wird einmalig geladen)
async function imageToText(file, onProgress) {
  await loadScript(LIB.tess);
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 2200 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
  const ctx = cv.getContext('2d'); ctx.filter = 'grayscale(1) contrast(1.4)'; ctx.drawImage(img, 0, 0, cv.width, cv.height);
  const pfad = new URL('bibliotheken/tesseract/', location.href).href;
  const worker = await window.Tesseract.createWorker('deu', 1, { workerPath: pfad + 'worker.min.js', corePath: pfad + 'kern/', langPath: pfad + 'sprache/', workerBlobURL: false, logger: m => { if (m.progress != null && onProgress) onProgress(m.status, m.progress); } });
  try {
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('Zeitüberschreitung')), 90000));
    const { data } = await Promise.race([worker.recognize(cv), timeout]);
    return data.text;
  } finally { try { await worker.terminate(); } catch (e) {} }
}
async function fileToText(file, onProgress) {
  if (/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name)) {
    const t = await pdfToText(file);
    if (t.replace(/\s/g, '').length < 5) throw new Error('Die PDF enthält keinen auslesbaren Text (vermutlich ein Scan). Fotografiere sie stattdessen oder füge den Text ein.');
    return t;
  }
  if (/^text\/|csv$/i.test(file.type) || /\.(txt|csv)$/i.test(file.name)) return await file.text();
  return await imageToText(file, onProgress);
}

// ---------- Notenübersicht ----------
function calc(c, sid) {
  const ents = c.entries.filter(e => e.sid === sid);
  const r = C.overall(ents, c.cats, c.level, c.units);
  const ov = c.overrides[sid];
  const zv = zeugnisVorschlag(c, r.value);
  return { ...r, ents, zv, final: ov && ov.p != null ? ov.p : zv, over: !!(ov && ov.p != null) };
}
// Zeugnisvorschlag mit Rundungsgrenze der Lerngruppe (Sek I: ganze Noten ohne Tendenz)
const WHOLE_P = { 1: 14, 2: 11, 3: 8, 4: 5, 5: 2, 6: 0 };
const roundOf = c => (c.round != null ? +c.round : 0.5);
function zeugnisVorschlag(c, v) {
  if (v == null) return null;
  const thr = roundOf(c), f = Math.floor(v + 1e-9), up = (v - f) >= thr - 1e-9;
  if (c.level === 'sek2') return Math.max(0, Math.min(15, up ? f + 1 : f));
  return WHOLE_P[Math.max(1, Math.min(6, up ? f + 1 : f))];
}
// Vergessen: Hausaufgaben, Material, Sportsachen
const MARK = { ha: ['HA', 'Hausaufgaben vergessen', 'Hausaufgaben'], mat: ['Mat', 'Material vergessen', 'Material'], sport: ['SpS', 'Sportsachen vergessen', 'Sportsachen'], verl: ['Verl', 'anwesend, aber verletzt', 'Verletzt'], krank: ['Krank', 'anwesend, aber erkrankt', 'Erkrankt'] };
const markTypes = c => c.subject === 'sport' ? ['sport', 'ha', 'mat'] : ['ha', 'mat'];
// Sport: anwesend, aber nicht aktiv (tageweise; längere Zeiträume weiter über „Befreiung“)
const partTypes = c => c.subject === 'sport' ? ['verl', 'krank'] : [];
const allMarkTypes = c => [...markTypes(c), ...partTypes(c)];
const curMT = c => allMarkTypes(c).includes(UI.markType) ? UI.markType : allMarkTypes(c)[0];
const marksOf = c => (c.marks = c.marks || []);
const hasMark = (c, sid, d, t) => marksOf(c).some(x => x.sid === sid && x.date === d && x.t === t);
const markCount = (c, sid, t) => marksOf(c).filter(x => x.sid === sid && x.t === t).length;
// Verletzt/Erkrankt: Antippen = entschuldigt → unentschuldigt → aus
const isPart = t => t === 'verl' || t === 'krank';
const markState = (c, sid, d, t) => { const x = marksOf(c).find(y => y.sid === sid && y.date === d && y.t === t); return x ? (x.e || 'e') : ''; };
const markSplit = (c, sid, t) => { const r = { e: 0, u: 0 }; marksOf(c).forEach(x => { if (x.sid === sid && x.t === t) r[x.e === 'u' ? 'u' : 'e']++; }); return r; };
function markExport(c, sid, t) { const n = markCount(c, sid, t); if (!isPart(t) || !n) return n; const sp = markSplit(c, sid, t); return `${n} (${sp.e} e, ${sp.u} u)`; }
function markToast(t, on) { return on ? MARK[t][1] + (isPart(t) ? (on === 'u' ? ', unentschuldigt' : ', entschuldigt') : '') : MARK[t][1] + ' – entfernt'; }
function toggleMark(c, sid, d, t) {
  const x = marksOf(c).find(y => y.sid === sid && y.date === d && y.t === t);
  if (isPart(t)) {
    if (!x) { marksOf(c).push({ id: uid(), sid, date: d, t, e: 'e' }); return 'e'; }
    if ((x.e || 'e') === 'e') { x.e = 'u'; return 'u'; }
    c.marks = marksOf(c).filter(y => y !== x); return false;
  }
  if (x) { c.marks = marksOf(c).filter(y => y !== x); return false; }
  marksOf(c).push({ id: uid(), sid, date: d, t }); return true;
}
const mkCls = n => n >= 3 ? 'mkhi' : '';
function markBtns(c, sid, d, types) {
  return (types || markTypes(c)).map(t => { const on = hasMark(c, sid, d, t), n = markCount(c, sid, t), st = isPart(t) ? markState(c, sid, d, t) : '';
    return `<button class="mkb ${isPart(t) ? 'pt' : ''} ${st === 'u' ? 'u' : ''}" data-a="mark" data-id="${sid}" data-t="${t}" data-d="${d}" aria-pressed="${on}" title="${MARK[t][1]} am ${fmtDate(d)}${isPart(t) ? ' – antippen: entschuldigt → unentschuldigt → aus' : ''}">${MARK[t][2]}${st ? ' · ' + (st === 'u' ? 'unentsch.' : 'entsch.') : ''}${n ? ` (${n})` : ''}</button>`; }).join('');
}

function examMax(ex) { return ex.tasks.reduce((a, t) => a + (+t.max || 0), 0); }
function examResults(c, ex) {
  const max = examMax(ex);
  return c.students.map(s => {
    const sc = ex.scores[s.id] || {};
    const has = (sc.pts || []).some(v => v !== '' && v != null);
    if (sc.absent || !has || !max) return { sid: s.id, sum: null, pct: null, p: null, absent: !!sc.absent };
    const sum = ex.tasks.reduce((a, t, i) => a + (parseFloat(String((sc.pts || [])[i] ?? '').replace(',', '.')) || 0), 0);
    const pct = sum / max * 100;
    return { sid: s.id, sum, pct, p: C.examPoints(pct, ex.key, c.level, ex.tend) };
  });
}

const NOTE_TAGS = { beob: 'Beobachtung', eltern: 'Elterngespräch', abspr: 'Absprache', foerder: 'Förderung', sonst: 'Sonstiges' };
function chartSVG(c, ents) {
  const pts = [...ents].sort((a, b) => a.date.localeCompare(b.date));
  if (pts.length < 2) return '<p class="muted small">Ab zwei Noten erscheint hier der Verlauf.</p>';
  const W = 640, H = 180, L = 34, R = 10, T = 10, B = 24;
  const sek2 = c.level === 'sek2';
  const yv = e => sek2 ? e.p : C.decimalOf(e.p);
  const y = v => sek2 ? T + (15 - v) / 15 * (H - T - B) : T + (v - 0.67) / (6 - 0.67) * (H - T - B);
  const x = i => L + i * (W - L - R) / (pts.length - 1);
  const colors = ['var(--navy-2)', 'var(--warn)', 'var(--ok)', 'var(--e)', 'var(--bad)'];
  const ci = id => Math.max(0, c.cats.findIndex(k => k.id === id)) % colors.length;
  let run = [], line = '';
  pts.forEach((e, i) => { run.push(e); const a = C.overall(run, c.cats, c.level, c.units).value; line += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(a).toFixed(1); });
  const ticks = sek2 ? [15, 10, 5, 0] : [1, 2, 3, 4, 5, 6];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Notenverlauf">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${t}</text>`).join('')}
    <path d="${line}" fill="none" stroke="var(--yellow)" stroke-width="3"/>
    ${pts.map((e, i) => `<circle cx="${x(i)}" cy="${y(yv(e))}" r="5" fill="${colors[ci(e.cat)]}"><title>${fmtDate(e.date)}: ${lab(e.p, c)}</title></circle>`).join('')}
    <text x="${L}" y="${H - 6}" font-size="12" fill="var(--muted)">${fmtDate(pts[0].date)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="12" fill="var(--muted)">${fmtDate(pts[pts.length - 1].date)}</text>
  </svg><p class="small muted">Punkte = Einzelnoten (Farbe je Kategorie: ${c.cats.map((k, i) => `<span style="color:${colors[i % colors.length]}">●</span> ${esc(k.name)}`).join(', ')}), gelbe Linie = laufende Gesamtnote.</p>`;
}

async function runOCR(input, type, textId) {
  const f = input.files[0]; if (!f) return; input.value = '';
  const m = UI.modal; if (!m || m.type !== type) return;
  m.text = $('#' + textId).value; m.err = ''; m.busy = /pdf/i.test(f.type) || /\.pdf$/i.test(f.name) ? 'PDF wird ausgelesen …' : 'Texterkennung wird geladen …'; m.progress = 0.02; renderModal();
  try {
    const text = await fileToText(f, (status, p) => {
      if (UI.modal !== m) return; m.busy = status === 'recognizing text' ? 'Text wird erkannt …' : 'Texterkennung wird vorbereitet …'; m.progress = p;
      const bar = document.querySelector('#modal .progress span'); if (bar) bar.style.width = Math.round(p * 100) + '%';
      const lbl = document.querySelector('#modal .progress'); if (lbl && lbl.previousElementSibling) lbl.previousElementSibling.textContent = m.busy;
    });
    m.text = (m.text ? m.text.trim() + '\n' : '') + text.trim();
  } catch (e) {
    m.err = (e && e.message && !/^Laden fehlgeschlagen/.test(e.message) ? e.message + ' ' : '') +
      'Die automatische Erkennung hat nicht funktioniert. Alternative: Auf dem iPad das Foto in „Fotos“ öffnen, Text markieren (Live Text), kopieren und hier einfügen.';
  }
  m.busy = ''; if (UI.modal === m) renderModal();
}

  if (e.key === 'Enter' && (e.target.id === 'pw' || e.target.id === 'pw2')) { e.preventDefault(); (e.target.id === 'pw' ? doUnlock : doSetup)(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.bk) { e.preventDefault(); const all = [...document.querySelectorAll('[data-bk]')]; const nx = all[all.indexOf(e.target) + 1]; if (nx) nx.focus(); else e.target.blur(); }
  if (e.key === 'Enter' && e.target.dataset && (e.target.dataset.c === 'score' || e.target.dataset.c === 'meas')) {

    e.preventDefault(); const t = e.target;
    const all = [...document.querySelectorAll(`[data-c="${t.dataset.c}"]` + (t.dataset.i != null ? `[data-i="${t.dataset.i}"]` : ''))].filter(x => !x.disabled);
    const nx = all[all.indexOf(t) + 1]; if (nx) nx.focus(); else t.blur();
  }
  if (e.key === 'Enter' && e.target.id === 'newnote') { e.preventDefault(); const b = document.querySelector('[data-a="addnote"]'); if (b) b.click(); }
  if (e.key === 'Escape' && UI.pick) { UI.pick = null; render(); return; }

/* Notenbuch – Teil 5: Stundenplan und freier Sitzplan */
const ROOM_W = 1150, DESK_W = 128, DESK_H = 92, GAP_X = 12, GAP_Y = 18, TOP = 24, LEFT = 21, PER_ROW = 8, BOARD_SPACE = 70;
function gridSlot(i) { return { x: LEFT + (i % PER_ROW) * (DESK_W + GAP_X), y: TOP + Math.floor(i / PER_ROW) * (DESK_H + GAP_Y) }; }
function overlaps(a, b) { return a.x < b.x + DESK_W && b.x < a.x + DESK_W && a.y < b.y + DESK_H && b.y < a.y + DESK_H; }
function migrateSeats(c) {
  if (!c.seats) c.seats = { pos: {} };
  if (c.seats.map && !c.seats.pos) {
    const pos = {};
    Object.entries(c.seats.map).forEach(([sid, rc]) => { const [r, k] = rc.split('-').map(Number); pos[sid] = { x: LEFT + k * (DESK_W + GAP_X) * 0.85, y: TOP + r * (DESK_H + GAP_Y) }; });
    c.seats = { pos };
  }
  if (!c.seats.pos) c.seats.pos = {};
  if (!c.seats.v || c.seats.v < 2) {
    // Tafel jetzt unten: bisherige Anordnung (Tafel oben) vertikal spiegeln
    const ps = Object.values(c.seats.pos);
    if (ps.length) { const maxB = Math.max(...ps.map(p => p.y + 78)); ps.forEach(p => { p.y = Math.max(0, Math.round(TOP + maxB - (p.y + 78))); }); }
    c.seats.v = 2;
  }
  if (c.seats.v === 2) {
    // größere Tische: Abstände im gleichen Verhältnis mitskalieren, damit nichts überlappt
    Object.values(c.seats.pos).forEach(p => { p.x = Math.round(LEFT + (p.x - 18) * (DESK_W + GAP_X) / 122); p.y = Math.round(TOP + (p.y - 24) * (DESK_H + GAP_Y) / 76); p.x = Math.max(0, Math.min(ROOM_W - DESK_W, p.x)); p.y = Math.max(0, p.y); });
    c.seats.v = 3;
  }
}
// Alle ohne Platz bekommen den nächsten freien Rasterplatz (alphabetisch)
function ensureSeats(c) {
  migrateSeats(c);
  if (isGroups(c)) { if (!c.seats.slot) c.seats.slot = {}; if (groupAutofill(c, false)) save(); return; }
  const pos = c.seats.pos; let changed = false;
  Object.keys(pos).forEach(sid => { if (!stu(c, sid)) { delete pos[sid]; changed = true; } });
  if (!Object.keys(pos).length && c.students.length) c.seats.auto = true;   // unberührter Plan: darf sich an den Bildschirm anpassen
  let i = 0;
  C.sortStudents(c.students, 'last').forEach(s => {
    if (pos[s.id]) return;
    let slot; do { slot = gridSlot(i++); } while (Object.values(pos).some(p => overlaps(p, slot)) && i < 400);
    pos[s.id] = slot; changed = true;
  });
  if (changed) save();
}
function roomHeight(c) { const ys = Object.values(c.seats.pos).map(p => p.y); return Math.max(420, (ys.length ? Math.max(...ys) : 0) + DESK_H + BOARD_SPACE); }

// ---------- Stundenplan ----------
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
function nowInfo() {
  const d = new Date(); const wd = d.getDay() - 1; const m = d.getHours() * 60 + d.getMinutes();
  return { day: wd >= 0 && wd <= 4 ? wd : -1, min: m };
}
// ISO-Kalenderwoche; die Schule wechselt strikt nach gerader/ungerader KW
function isoWeek(dt = new Date()) {
  const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  const wd = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - wd);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - y0) / 864e5 + 1) / 7);
}
const curPar = () => isoWeek() % 2 === 0 ? 'g' : 'u';
const PARNAME = { g: 'gerade', u: 'ungerade' };
// Belegung einer Doppelstunde in Woche par: wochenspezifisch vor „jede Woche“; '__none' = in dieser Woche frei
function slotInfo(key, par) {
  const tt = S.timetable, sp = tt[key + '@' + par];
  const id = sp === '__none' ? null : (sp || tt[key]);
  const k = id && S.classes.find(x => x.id === id && !x.archived) || null;
  return { k, special: !!sp, differs: !!(tt[key + '@g'] || tt[key + '@u']) };
}
function slotClass(key, par = curPar()) { return slotInfo(key, par).k; }
function currentSlots() {
  const { day, min } = nowInfo(); if (day < 0) return {};
  const P = S.settings.periods; let cur = null, next = null;
  P.forEach((p, i) => {
    const k = slotClass(DAYS[day] + '-' + i); if (!k) return;
    if (min >= toMin(p.from) - 5 && min <= toMin(p.to)) cur = { i, k, key: DAYS[day] + '-' + i };
    else if (min < toMin(p.from) - 5 && !next) next = { i, k, key: DAYS[day] + '-' + i };
  });
  return { cur, next, day };
}
// Angezeigte Woche: Versatz in Wochen zur aktuellen Kalenderwoche (0 = diese Woche)
const isoDateOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
function mondayOf(dt) { const d = new Date(dt); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
function weekInfo(off = UI.weekOff || 0, now = new Date()) {
  const mon = mondayOf(now); mon.setDate(mon.getDate() + 7 * off);
  const days = DAYS.map((_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  const kw = isoWeek(mon), dm = d => pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.';
  return { off, mon, days, kw, par: kw % 2 === 0 ? 'g' : 'u', cur: off === 0, dm, range: `${dm(days[0])}–${dm(days[4])}${days[4].getFullYear()}` };
}
function weekNavHTML(wk) {
  return `<div class="weeknav noprint ${wk.cur ? '' : 'other'}" role="group" aria-label="Kalenderwoche">
      <button class="btn wk-b" data-a="weekstep" data-d="-1" aria-label="Vorherige Kalenderwoche">‹</button>
      <div class="wk-t"><b>KW ${wk.kw}</b><span>${wk.range}, ${PARNAME[wk.par]}</span></div>
      <button class="btn wk-b" data-a="weekstep" data-d="1" aria-label="Nächste Kalenderwoche">›</button>
      ${wk.cur ? '' : '<button class="btn sm" data-a="weekstep" data-d="0">Aktuelle Woche</button>'}
      <input class="in wk-date" type="date" value="${isoDateOf(wk.mon)}" data-c="weekdate" aria-label="Zu Datum springen" title="Zu Datum springen">
    </div>`;
}
Object.assign(A, { weekstep: el => { const d = +el.dataset.d; UI.weekOff = d === 0 ? 0 : (UI.weekOff || 0) + d; render(); } });

      <div class="row">${act.map(k => `<button class="chip s-${k.subject}" data-a="brush" data-id="${k.id}" aria-pressed="${UI.planBrush === k.id}">${esc(k.name)}</button>`).join('')}

}

function parseAnyGrade(v, level) {
  v = String(v || '').trim().replace('−', '-').replace('–', '-');
  if (!v) return undefined;
  const p = C.parseGradeLabel(v, level); if (p != null) return p;
  const n = parseFloat(v.replace(',', '.'));
  if (!isNaN(n)) { if (level === 'sek2') { if (Number.isInteger(n) && n >= 0 && n <= 15) return n; } else if (n >= 0.6 && n <= 6) return C.pointsFromDecimal(n); }
  return null;
}

// Nur Zeichen, die die PDF-Standardschrift kennt
const pdfTxt = t => String(t == null ? '' : t).replace(/[✓★🏅]/g, '').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF–—„“”‚‘’…•·€]/g, '');
async function yearPdfBlob(c) {
  await loadScript(LIB.jspdf); await loadScript(LIB.autotable);
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ orientation: 'portrait' }), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const blue = [20, 40, 75], units = usesUnits(c) ? unitsOf(c).filter(u => c.entries.some(e => e.unit === u.id)) : [];
  const title = `${c.name} – ${subjName(c.subject)}, ${c.year}, ${c.term}. Halbjahr`;
  doc.setFontSize(15); doc.text(pdfTxt('Abschlussdokumentation ' + title), 14, 16);
  doc.setFontSize(9); doc.text(pdfTxt(`Erstellt ${fmtDate(today())}. Gewichtung: ${c.cats.map(k => k.name + ' ' + k.w + ' %').join(', ')}${units.length ? '. Sportarten: ' + units.map(u => `${u.name} (${(u.subs || []).map(sb => sb.name + ' ' + sb.w).join(', ')}; Gewicht ${u.w})`).join('; ') : ''}`), 14, 22, { maxWidth: W - 28 });
  const head = ['Name', ...units.map(u => u.name), ...c.cats.map(k => 'Ø ' + k.name), 'Ø ges.', 'Zeugnis', 'E', 'U', 'V'];
  const body = sorted(c).map(s => { const r = calc(c, s.id), n = { e: 0, u: 0, v: 0 }; Object.values(c.att).forEach(d => { if (d[s.id]) n[d[s.id]]++; });
    return [nameOf(s, c), ...units.map(u => r.perUnit[u.id] ? C.fmtAvg(r.perUnit[u.id].value, c.level) : '–'), ...c.cats.map(k => r.perCat[k.id] != null ? C.fmtAvg(r.perCat[k.id], c.level) : '–'), r.value != null ? C.fmtAvg(r.value, c.level) : '–', r.final != null ? lab(r.final, c) + (r.over ? ' *' : '') : '–', n.e, n.u, n.v].map(pdfTxt); });
  doc.autoTable({ head: [head.map(pdfTxt)], body, startY: 32, styles: { fontSize: 8, cellPadding: 1.2 }, headStyles: { fillColor: blue }, margin: { left: 12, right: 12 } });
  let y = doc.lastAutoTable.finalY + 4; doc.setFontSize(8); doc.text('* = von der Lehrkraft festgelegt', 14, y);
  // Einzelübersichten
  sorted(c).forEach(s => {
    const r = calc(c, s.id), ov = c.overrides[s.id] || {}, n = { e: 0, u: 0, v: 0 }; Object.values(c.att).forEach(d => { if (d[s.id]) n[d[s.id]]++; });
    y = doc.lastAutoTable.finalY + 12; if (y > H - 50) { doc.addPage(); y = 18; }
    doc.setFontSize(12); doc.setTextColor(...blue); doc.text(pdfTxt(nameOf(s, c)), 14, y); doc.setTextColor(0);
    const lines = [
      `Zeugnisnote: ${r.final != null ? lab(r.final, c) : '–'}${r.value != null ? ` (berechnet ${C.fmtAvg(r.value, c.level)})` : ''}${r.over && ov.reason ? ' – Begründung: ' + ov.reason : ''}`,
      c.cats.map(k => `${k.name}: ${r.perCat[k.id] != null ? C.fmtAvg(r.perCat[k.id], c.level) : '–'}`).join(' | ') + (units.length ? ' | ' + units.filter(u => r.perUnit[u.id]).map(u => `${u.name}: ${C.fmtAvg(r.perUnit[u.id].value, c.level)} (${unitSubsText(c, u, r.perUnit[u.id])})`).join(' | ') : ''),
      `Fehlzeiten: ${n.e} entschuldigt, ${n.u} unentschuldigt, ${n.v} verspätet${s.nta ? ' | NTA: ' + s.nta : ''}`
    ];
    doc.setFontSize(8.5); let yy = y + 5; lines.forEach(t => { const w = doc.splitTextToSize(pdfTxt(t), W - 28); doc.text(w, 14, yy); yy += w.length * 4; });
    const rec = studentRecords(c, s).map(r2 => r2.map(pdfTxt));
    doc.autoTable({ head: [['Datum', 'Art', 'Eintrag', 'Note']], body: rec.length ? rec : [['', '', 'keine Einträge', '']], startY: yy, styles: { fontSize: 8, cellPadding: 1 }, headStyles: { fillColor: [90, 100, 120] }, columnStyles: { 0: { cellWidth: 20 }, 1: { cellWidth: 24 }, 3: { cellWidth: 16, halign: 'center' } }, margin: { left: 14, right: 14 } });
  });
  const ts = [...topicsOf(c)].sort((a, b) => a.date.localeCompare(b.date));
  if (ts.length) { doc.addPage(); doc.setFontSize(12); doc.text('Lehrstoff', 14, 18); doc.autoTable({ head: [['Datum', 'Gemacht', 'Geplant']], body: ts.map(t => [fmtDate(t.date), t.done || '', t.plan || ''].map(pdfTxt)), startY: 22, styles: { fontSize: 8, cellPadding: 1 }, headStyles: { fillColor: blue }, columnStyles: { 0: { cellWidth: 20 } } }); }
  const pages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(120); doc.text(pdfTxt(`${title} – vertraulich, enthält personenbezogene Daten`), 14, H - 6); doc.text(`Seite ${i} von ${pages}`, W - 14, H - 6, { align: 'right' }); doc.setTextColor(0); }
  return doc.output('blob');
}
const YE_CH = { keep: 'Behalten', roster: 'Nur Schülerliste', del: 'Löschen' };

        <div class="seg" role="group" aria-label="Danach">${Object.entries(YE_CH).map(([v, t]) => `<button data-a="yechoice" data-id="${k.id}" data-v="${v}" aria-pressed="${ch === v}">${t}</button>`).join('')}</div>

// Lerngruppe leeren, Schülerliste und Einstellungen behalten
function rosterOnly(k) {
  const keep = { id: k.id, name: k.name, subject: k.subject, level: k.level, cats: k.cats, sort: k.sort, seats: k.seats, units: k.units, year: nextYear(k.year), term: 1, archived: false,
